# Staging stack: production-shaped (Postgres 16 + pgvector, same images) but
# isolated from prod. Run with:
#
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
#
# This is a standalone file, not an override of docker-compose.prod.yml.
# Overrides merge `ports` and `depends_on` additively, and a merge surprise
# that attached staging to the prod Postgres could apply a migration to the
# real databases. Staging has its own Postgres and its own compose project
# name so `down -v` cannot touch prod data.
#
# Default services are db + api + web (Juicebox migration/API rehearsal).
# Foray is a profile because a second copy of the baked embedding model
# would compete with prod for RAM on the 4 GB VM — start it only when
# rehearsing Foray changes, and never during the 23:00 UTC nightly window.
#
#   docker compose -f docker-compose.staging.yml --env-file .env.staging --profile foray up -d --build
#
# No public ports. Caddy is omitted; reach the stack through an SSH tunnel
# to 127.0.0.1:18080. EMAIL_PROVIDER is hard-wired to console so a restored
# dump cannot send mail. See deploy/STAGING.md.
name: juicebox-staging

x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-staging-app-env: &staging_app_env
  JUICEBOX_ENV: staging
  DATABASE_URL: postgresql+psycopg://juicebox:${STAGING_POSTGRES_PASSWORD:-juicebox}@db:5432/juicebox_staging
  BASE_URL: http://127.0.0.1:18080
  SECRET_KEY: ${STAGING_SECRET_KEY:?set STAGING_SECRET_KEY in .env.staging — must differ from prod}
  CORS_ORIGINS: http://127.0.0.1:18080,http://localhost:18080
  # Hard-wired: a restored prod dump still has real candidate emails. Staging
  # must never send. Do not interpolate SMTP_* or OUTREACH_* from prod .env.
  EMAIL_PROVIDER: console
  OUTREACH_FROM_EMAIL: staging@localhost
  JUICEBOX_LLM_ENABLED: ${JUICEBOX_LLM_ENABLED:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}

x-staging-foray-env: &staging_foray_env
  FORAY_DATABASE_URL: postgresql://foray:${STAGING_FORAY_DB_PASSWORD:-foray}@db:5432/foray_staging
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  APOLLO_API_KEY: ${APOLLO_API_KEY:-}
  FORAY_DISPLAY_FLOOR: ${FORAY_DISPLAY_FLOOR:-20}
  FORAY_ENRICH_REPOS: ${FORAY_ENRICH_REPOS:-18}
  FORAY_ENRICH_BATCH_SIZE: ${FORAY_ENRICH_BATCH_SIZE:-16}
  FORAY_SCORING_CONCURRENCY: ${FORAY_SCORING_CONCURRENCY:-10}
  # Tiny budgets so a rehearsal cannot spend like nightly prod.
  FORAY_NIGHTLY_SHARDS: ${FORAY_NIGHTLY_SHARDS:-2}
  FORAY_NIGHTLY_ENRICH: ${FORAY_NIGHTLY_ENRICH:-20}
  FORAY_NIGHTLY_SCORE_CALLS: ${FORAY_NIGHTLY_SCORE_CALLS:-10}
  FORAY_NIGHTLY_BUDGET_MIN: ${FORAY_NIGHTLY_BUDGET_MIN:-15}
  FORAY_MONTHLY_SPEND_CAP_USD: ${FORAY_MONTHLY_SPEND_CAP_USD:-1}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default_logging
    environment:
      POSTGRES_USER: juicebox
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:-juicebox}
      POSTGRES_DB: juicebox_staging
      FORAY_DB_PASSWORD: ${STAGING_FORAY_DB_PASSWORD:-foray}
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
      - ./deploy/staging/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juicebox -d juicebox_staging"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    image: juicebox-staging-api
    restart: unless-stopped
    logging: *default_logging
    environment: *staging_app_env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m juicebox.cli migrate &&
             uvicorn juicebox.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    image: juicebox-staging-api
    profiles: ["worker"]
    restart: unless-stopped
    logging: *default_logging
    environment: *staging_app_env
    depends_on:
      api:
        condition: service_healthy
    command: python -m juicebox.cli work

  foray:
    build:
      context: packages/foray
      dockerfile: Dockerfile
    image: juicebox-staging-foray
    profiles: ["foray"]
    restart: unless-stopped
    mem_limit: 1500m
    logging: *default_logging
    environment: *staging_foray_env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "./scripts/migrate.sh &&
             uvicorn foray.api.app:app --host 0.0.0.0 --port 8100"

  # One-shot. Rehearse the nightly orchestrator against the staging database;
  # never install this on host cron. Image name is juicebox-staging-foray so a
  # rebuild cannot retag the prod juicebox-foray image.
  foray-jobs:
    build:
      context: packages/foray
      dockerfile: Dockerfile
    image: juicebox-staging-foray
    profiles: ["jobs"]
    restart: "no"
    mem_limit: 1500m
    logging: *default_logging
    environment: *staging_foray_env
    depends_on:
      db:
        condition: service_healthy
    command: python -m foray.refresh.nightly

  web:
    build:
      context: packages/web
      dockerfile: Dockerfile
    image: juicebox-staging-web
    restart: unless-stopped
    logging: *default_logging
    ports:
      # Host-local only. Reach via ssh -L 18080:127.0.0.1:18080.
      - "127.0.0.1:18080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata_staging:
