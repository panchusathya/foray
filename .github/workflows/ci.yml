name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  # No credentials in CI: the suite must pass with the model switched off.
  JUICEBOX_LLM_ENABLED: "false"

jobs:
  python:
    name: python (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: packages/core/pyproject.toml

      - name: Install
        run: pip install -e "packages/core[dev]" pre-commit

      - name: Lint
        run: ruff check packages/core packages/foray eval

      - name: Pre-commit guardrails
        run: pre-commit run --all-files

      # The gitleaks pre-commit hook runs `gitleaks git --staged`, which scans
      # nothing in a clean CI checkout. Scan the whole tree explicitly so the
      # secret guardrail is real in CI and not only on a developer's machine.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.27.2
        run: |
          curl -sSfL             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks dir . --redact --no-banner

      - name: Test
        run: pytest -q
        working-directory: packages/core

  postgres:
    name: python (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: juicebox
          POSTGRES_PASSWORD: juicebox
          POSTGRES_DB: juicebox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U juicebox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://juicebox:juicebox@localhost:5432/juicebox
      JUICEBOX_TEST_DATABASE_URL: postgresql+psycopg://juicebox:juicebox@localhost:5432/juicebox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: packages/core/pyproject.toml

      - name: Install
        run: pip install -e "packages/core[postgres,dev]"

      - name: Migrate
        run: python -m alembic upgrade head
        working-directory: packages/core

      # Catches a model change that shipped without a migration.
      - name: Check for schema drift
        run: python -m alembic check
        working-directory: packages/core

      - name: Test against postgres
        run: pytest -q
        working-directory: packages/core

      - name: Search quality on postgres retrieval
        run: python ../../eval/run_eval.py --corpus-size 400 --min-ndcg 0.8 --database-url "$DATABASE_URL"
        working-directory: packages/core

  foray:
    # Foray is asyncpg + pgvector; SQLite cannot exercise it. Until this job
    # existed, DB-backed tests skipped on CI and every Foray SQL change was
    # first proven on the prod VM.
    name: foray (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: juicebox
          POSTGRES_PASSWORD: juicebox
          POSTGRES_DB: juicebox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U juicebox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORAY_DATABASE_URL: postgresql://foray:foray@localhost:5432/foray
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: packages/foray/pyproject.toml

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create foray and foray_staging databases
        env:
          PGPASSWORD: juicebox
        run: |
          psql -h localhost -U juicebox -d juicebox -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE foray WITH LOGIN PASSWORD 'foray';
          CREATE DATABASE foray OWNER foray;
          CREATE DATABASE foray_staging OWNER foray;
          SQL
          psql -h localhost -U juicebox -d foray -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector; GRANT ALL ON SCHEMA public TO foray;"
          psql -h localhost -U juicebox -d foray_staging -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector; GRANT ALL ON SCHEMA public TO foray;"

      - name: Install foray (no torch — tests marked `model` are skipped)
        run: |
          pip install "asyncpg>=0.29" "pydantic>=2.7" "pydantic-settings>=2.3" \
            "fastapi>=0.115" "httpx>=0.27" "pyyaml>=6.0" "tenacity>=8.5" \
            "structlog>=24.1" "uvicorn>=0.30" "pytest>=8.0" "pytest-asyncio>=0.23" \
            "ruff>=0.11" "mypy>=1.15" "import-linter>=2.3"
          pip install --no-deps -e packages/foray

      - name: Migrate foray (twice — second run must be a no-op)
        run: |
          ./scripts/migrate.sh
          ./scripts/migrate.sh
        working-directory: packages/foray

      - name: Migrate the staging database name
        env:
          FORAY_DATABASE_URL: postgresql://foray:foray@localhost:5432/foray_staging
        run: |
          ./scripts/migrate.sh
          ./scripts/migrate.sh
        working-directory: packages/foray

      - name: Lint
        run: ruff check .
        working-directory: packages/foray

      - name: Type-check pure ranking core
        run: mypy
        working-directory: packages/foray

      - name: Check ranking import boundary
        run: lint-imports
        working-directory: packages/foray

      - name: Test
        run: pytest -q -m "not model"
        working-directory: packages/foray

      - name: Synthetic seed, derive, profile-email dry-run
        run: |
          python scripts/seed_synthetic.py --count 25 --reset
          python -m foray.enrich.derive --limit 25
          python -m foray.enrich.emails --source profile --dry-run
        working-directory: packages/foray

  compose:
    name: compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Isolation guards
        run: python deploy/tests/check_compose.py

      - name: Render prod compose
        run: docker compose -f docker-compose.prod.yml --env-file deploy/ci.env config >/dev/null

      - name: Render staging compose
        run: docker compose -f docker-compose.staging.yml --env-file deploy/ci.env config >/dev/null

  staging-smoke:
    # Boots the full staging stack INCLUDING Foray (the 3 GB CPU-torch image —
    # the build cost buys the Sourcing specs, which otherwise self-skip and
    # leave every LinkedIn rendering change untested). Proves migrations run on
    # juicebox_staging/foray_staging and drives the browser suite end to end.
    name: staging smoke + browser suite
    runs-on: ubuntu-latest
    # This job shells into a booted stack, so a wedged container hangs a step
    # rather than failing it. Without a ceiling it sits on the runner until the
    # 6-hour default: runs #79, #80 and #83 burned 1h35m, 4h19m and 1h50m on
    # the same deadlocked seed step.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Boot staging stack (with Foray, so the Sourcing specs run)
        run: >
          docker compose -f docker-compose.staging.yml --env-file deploy/ci.env
          --profile foray up -d --build --wait --wait-timeout 600

      - name: Health
        run: curl -sf http://127.0.0.1:18080/health

      # TEMPORARY diagnostic -- remove with the script once the cause is fixed.
      # Discriminates between a late write and a lost one; see the script's
      # docstring. Writes its verdict to the run summary, because the step-log
      # viewer lazy-loads and buries output. Never gates the job.
      - name: Signup durability probe (temporary)
        run: python3 deploy/tests/signup_durability_probe.py --iterations 40

      # Both evidence kinds, then derive + embed so search actually returns
      # hits. Without this the Sourcing specs self-skip and every LinkedIn
      # rendering change ships untested.
      - name: Seed Foray with synthetic candidates (both sources)
        run: |
          compose="docker compose -f docker-compose.staging.yml --env-file deploy/ci.env"
          $compose run --rm --no-deps -T foray python scripts/seed_synthetic.py --count 40
          $compose run --rm --no-deps -T foray python scripts/seed_synthetic.py --count 40 --source linkedin
          $compose run --rm --no-deps -T foray python -m foray.enrich.derive
          $compose run --rm --no-deps -T foray python -m foray.embed.run
          $compose run --rm --no-deps -T foray python -m foray.score.run --offline

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install browser test deps
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: packages/web

      # Drives the real stack through a browser: login, project dedupe,
      # enrolment, the paused-sequence guard. Specs sign up their own orgs.
      - name: Browser regression suite
        run: npm run test:e2e
        working-directory: packages/web
        env:
          E2E_BASE_URL: http://127.0.0.1:18080

      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report
          retention-days: 7

      # A single undifferentiated `compose logs` dump is what this step used to
      # be, and it is unreadable: GitHub lazy-loads long step output, so the one
      # traceback that explains the failure cannot be found in the browser and
      # is not downloadable either. Print a bounded per-service tail inline
      # (api first -- it is what fails), and upload the full logs as an artifact.
      # always(), not failure(): the e2e failures here are usually rescued by
      # Playwright's retry, so the job goes green and a failure()-gated capture
      # would never fire on the very runs worth reading. The inline dump below
      # still only prints when something actually failed.
      - name: Staging logs
        if: always()
        env:
          JOB_FAILED: ${{ job.status == 'failure' }}
        run: |
          compose="docker compose -f docker-compose.staging.yml --env-file deploy/ci.env"
          mkdir -p staging-logs
          for svc in api worker db web foray; do
            $compose logs --no-color --timestamps "$svc" > "staging-logs/$svc.log" 2>&1 || true
          done
          $compose logs --no-color --timestamps > staging-logs/all-services.log 2>&1 || true
          $compose ps > staging-logs/ps.txt 2>&1 || true

          if [ "${JOB_FAILED}" = "true" ]; then
            for svc in api worker; do
              echo "::group::$svc -- last 120 lines"
              tail -n 120 "staging-logs/$svc.log" || true
              echo "::endgroup::"
            done
          fi

          # Two groups, because they want different shapes: a status anomaly
          # reads best as one compact line, while a traceback is useless without
          # the frames between "Traceback" and the exception, so that one takes
          # context. Both assign before printing -- grep's exit status is lost
          # through a pipeline, so `| tail || echo` can never report a miss.
          echo "::group::api -- request failures (4xx/5xx)"
          codes=$(grep -nE '" (5[0-9][0-9]|4(0[13]|09|22)) ' staging-logs/api.log 2>/dev/null || true)
          if [ -n "$codes" ]; then echo "$codes" | tail -n 60; else echo "(none)"; fi
          echo "::endgroup::"

          echo "::group::api -- full tracebacks"
          traces=$(grep -A 30 -E 'Traceback|Exception in ASGI application' staging-logs/api.log 2>/dev/null || true)
          if [ -n "$traces" ]; then echo "$traces" | tail -n 200; else echo "(none)"; fi
          echo "::endgroup::"

      - name: Staging logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-logs
          path: staging-logs
          retention-days: 7

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.staging.yml --env-file deploy/ci.env down -v

  eval:
    name: search quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: packages/core/pyproject.toml

      - name: Install
        run: pip install -e "packages/core[dev]"

      # Heuristic parser only, so the gate measures retrieval and scoring rather
      # than model variance.
      - name: Score the labelled query set
        run: python eval/run_eval.py --corpus-size 400 --min-ndcg 0.8

  node:
    name: ingest (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package declares `node >=20`, so test the floor as well as current:
        # the test runner's file discovery differs between them.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: npm test
        working-directory: packages/ingest

  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: packages/web

      - name: Build
        run: npm run build
        working-directory: packages/web

  lockfile:
    name: uv lock is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Fails if pyproject.toml changed without relocking.
      - name: Verify lockfile
        run: uv lock --check
        working-directory: packages/core

  docker:
    # The production VM runs these images; a Dockerfile that no longer builds
    # is a deploy outage, so CI builds all three (no registry push).
    name: docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: core (api/worker)
        run: docker build -f packages/core/Dockerfile .

      - name: web
        run: docker build packages/web

      - name: ingest
        run: docker build packages/ingest

      - name: foray
        run: docker build packages/foray
