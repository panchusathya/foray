# Production stack for a single VM. Run with:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Staging (rehearse migrations against a restored dump before merging to main)
# is a separate compose project — see docker-compose.staging.yml and
# deploy/STAGING.md. Do not override this file with the staging file; overrides
# merge ports additively.
#
# Reads secrets from a `.env` file next to this file (see
# .env.production.example). This is deliberately a standalone file, not an
# override of docker-compose.yml: overrides merge `ports` additively, so a
# forgotten -f flag or a merge surprise could publish Postgres to the internet.
#
# Topology: caddy is the only service with public ports (80/443) and serves
# ${APP_DOMAIN} with automatic Let's Encrypt TLS. It proxies to web's nginx,
# which serves the SPA and same-origin-proxies /v1/, /health, and /t/ to the
# api. db/api/web publish no host ports; ingest binds to localhost only.
name: juicebox

# Cap container logs everywhere: the VM has ~13 GB free and json-file defaults
# to unbounded, which is the most likely way this box fills its disk.
x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-foray-env: &foray_env
  FORAY_DATABASE_URL: postgresql://foray:${FORAY_DB_PASSWORD:?set FORAY_DB_PASSWORD in .env}@db:5432/foray
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  APOLLO_API_KEY: ${APOLLO_API_KEY:-}
  CONTACTOUT_API_KEY: ${CONTACTOUT_API_KEY:-}
  FORAY_INTERNAL_TOKEN: ${FORAY_INTERNAL_TOKEN:-}
  FORAY_DISPLAY_FLOOR: ${FORAY_DISPLAY_FLOOR:-20}
  FORAY_MAX_PAGINABLE: ${FORAY_MAX_PAGINABLE:-1000}
  FORAY_RETRIEVAL_ARMS: ${FORAY_RETRIEVAL_ARMS:-vector,lexical}
  FORAY_VECTOR_K: ${FORAY_VECTOR_K:-500}
  FORAY_LEXICAL_K: ${FORAY_LEXICAL_K:-500}
  FORAY_RRF_K: ${FORAY_RRF_K:-60}
  FORAY_W_RRF: ${FORAY_W_RRF:-0.5}
  FORAY_W_SCORE: ${FORAY_W_SCORE:-0.3}
  FORAY_W_VECTOR: ${FORAY_W_VECTOR:-0.2}
  # MiniLM + unscored=20 are a pair. Raising unscored without the CE lets
  # ungated rows flood page 1; enabling the CE with unscored=0 wastes it on a
  # pool where those rows still sink. The image bakes the weights.
  FORAY_UNSCORED_SCORE: ${FORAY_UNSCORED_SCORE:-20}
  FORAY_MIN_EVIDENCE: ${FORAY_MIN_EVIDENCE:-2}
  FORAY_HNSW_EF_SEARCH: ${FORAY_HNSW_EF_SEARCH:-100}
  FORAY_RERANK_ENABLED: ${FORAY_RERANK_ENABLED:-true}
  FORAY_RERANK_DEPTH: ${FORAY_RERANK_DEPTH:-48}
  FORAY_RERANK_CE_GAP: ${FORAY_RERANK_CE_GAP:-5.0}
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  FORAY_ENRICH_REPOS: ${FORAY_ENRICH_REPOS:-18}
  FORAY_ENRICH_BATCH_SIZE: ${FORAY_ENRICH_BATCH_SIZE:-16}
  FORAY_SCORING_CONCURRENCY: ${FORAY_SCORING_CONCURRENCY:-10}
  FORAY_NIGHTLY_SHARDS: ${FORAY_NIGHTLY_SHARDS:-350}
  FORAY_NIGHTLY_ENRICH: ${FORAY_NIGHTLY_ENRICH:-12000}
  FORAY_NIGHTLY_SCORE_CALLS: ${FORAY_NIGHTLY_SCORE_CALLS:-10000}
  FORAY_NIGHTLY_BUDGET_MIN: ${FORAY_NIGHTLY_BUDGET_MIN:-450}
  FORAY_MONTHLY_SPEND_CAP_USD: ${FORAY_MONTHLY_SPEND_CAP_USD:-40}

x-app-env: &app_env
  JUICEBOX_ENV: production
  DATABASE_URL: postgresql+psycopg://juicebox:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/juicebox
  # Baked into tracking links in outbound email — must be the public origin.
  BASE_URL: https://${APP_DOMAIN:?set APP_DOMAIN in .env, e.g. app.goforay.io}
  SECRET_KEY: ${SECRET_KEY:?generate with secrets.token_urlsafe(48) - see .env.production.example}
  CORS_ORIGINS: https://${APP_DOMAIN}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # The app's AI (sequence drafting, personalisation, reply drafts) runs through
  # OpenRouter here: there is no Anthropic key on this host, and without these
  # two lines every one of those features silently falls back to heuristics.
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  JUICEBOX_LLM_PROVIDER: ${JUICEBOX_LLM_PROVIDER:-openrouter}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-z-ai/glm-5.2}
  JUICEBOX_LLM_FAST_MODEL: ${JUICEBOX_LLM_FAST_MODEL:-}
  LLM_FAST_TIMEOUT_SECONDS: ${LLM_FAST_TIMEOUT_SECONDS:-20}
  JUICEBOX_LLM_ENABLED: ${JUICEBOX_LLM_ENABLED:-true}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  OUTREACH_FROM_EMAIL: ${OUTREACH_FROM_EMAIL:?set OUTREACH_FROM_EMAIL in .env}
  OUTREACH_FROM_NAME: ${OUTREACH_FROM_NAME:-}
  # Auto-drafting replies into the user's Drafts folder. Off: the drafts were
  # not good enough to justify writing into a mailbox we do not own and
  # emailing the owner about it. Set true only when that changes.
  REPLY_DRAFTING_ENABLED: ${REPLY_DRAFTING_ENABLED:-false}
  OUTREACH_DAILY_CAP: ${OUTREACH_DAILY_CAP:-200}
  MS_CLIENT_ID: ${MS_CLIENT_ID:-}
  MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
  MS_TENANT_ID: ${MS_TENANT_ID:-organizations}
  MS_REDIRECT_URI: ${MS_REDIRECT_URI:-}
  ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
  ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
  ZOHO_REDIRECT_URI: ${ZOHO_REDIRECT_URI:-}
  ZOHO_ACCOUNTS_DOMAIN: ${ZOHO_ACCOUNTS_DOMAIN:-https://accounts.zoho.com}
  # Same secret as x-foray-env above; the api container is the only caller of
  # Foray's paid routes, and reaches it by service name on the private network.
  FORAY_INTERNAL_TOKEN: ${FORAY_INTERNAL_TOKEN:-}
  FORAY_BASE_URL: ${FORAY_BASE_URL:-http://foray:8100}
  # Worker scrape of public job postings. Empty = skip cleanly (no error).
  # Put the key in /opt/juicebox/.env then recreate api + worker so they
  # pick it up — editing the file in an editor is not enough.
  EXA_API_KEY: ${EXA_API_KEY:-}
  LINQ_API_KEY: ${LINQ_API_KEY:-}
  LINQ_WEBHOOK_SECRET: ${LINQ_WEBHOOK_SECRET:-}
  LINQ_FROM_NUMBER: ${LINQ_FROM_NUMBER:-}
  LINQ_ENABLED: ${LINQ_ENABLED:-false}
  # Candidate documents (resumes, cover letters). The `filedata` volume is
  # mounted on api AND worker — the worker writes generated PDFs, the api
  # serves uploads and downloads. Back this volume up alongside pgdata: the
  # rows in candidate_documents are only the metadata half.
  JUICEBOX_FILE_STORAGE_DIR: /app/data/files
  # Where magic links point. The api and worker mint them, so they carry this;
  # the portal container itself never needs it.
  PORTAL_BASE_URL: https://${PORTAL_DOMAIN:?set PORTAL_DOMAIN in .env, e.g. apply.goforay.io}
  # Who sign-in codes come from. Separate from OUTREACH_FROM_EMAIL because a
  # candidate receiving a code has not necessarily met the recruiter whose
  # mailbox sends the outreach. Empty falls back to the outreach identity.
  # The SMTP user must be this address or a verified alias of it — Zoho and
  # most providers reject a From they did not authenticate.
  PORTAL_FROM_EMAIL: ${PORTAL_FROM_EMAIL:-}
  PORTAL_FROM_NAME: ${PORTAL_FROM_NAME:-Foray}
  # The proposal bar's score floor. Necessary but never sufficient — vetoes
  # and the explainability gate sit on top. Raising it above 1.0 is the kill
  # switch for candidate-facing job proposals: nothing clears the bar, so the
  # agent and the portal feed go quiet while onboarding, documents and the
  # recruiter views keep working. Held above 1.0 until the LL144 /
  # authority-to-apply counsel review clears.
  PROPOSAL_SCORE_FLOOR: ${PROPOSAL_SCORE_FLOOR:-0.55}
  # The logged-in LinkedIn session the profile scraper drives. Empty is a safe
  # state: the scrape raises and the thread falls back to asking questions.
  LINKEDIN_SESSION_COOKIE: ${LINKEDIN_SESSION_COOKIE:-}
  LINKEDIN_SESSION_PATH: ${LINKEDIN_SESSION_PATH:-}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default_logging
    # Parallel index builds use dynamic shared memory; Docker's default 64 MB
    # /dev/shm made the 200k-row HNSW rebuild die with "could not resize
    # shared memory segment ... No space left on device".
    shm_size: 1gb
    # Tuned for the 4 vCPU / 8 GB host (the image defaults assume 1 GB total).
    # maintenance_work_mem covers HNSW builds during the LinkedIn import.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=2GB
    environment:
      POSTGRES_USER: juicebox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: juicebox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juicebox"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    restart: unless-stopped
    logging: *default_logging
    environment: *app_env
    volumes:
      - filedata:/app/data/files
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m juicebox.cli migrate &&
             uvicorn juicebox.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    restart: unless-stopped
    logging: *default_logging
    environment: *app_env
    volumes:
      - filedata:/app/data/files
    depends_on:
      # service_healthy, not service_started: the api healthcheck only passes
      # once uvicorn is serving, which is only after migrations finished.
      api:
        condition: service_healthy
    command: python -m juicebox.cli work

    # The core image bakes a HEALTHCHECK that probes uvicorn on :8000 (correct
    # for `api`, which shares this image). The worker runs the queue loop and
    # serves no HTTP, so it inherited a probe that can only ever fail: it has
    # been reporting "unhealthy" in prod while working fine. Nothing depends on
    # worker being healthy, so drop the probe rather than invent a fake one.
    healthcheck:
      disable: true
  ingest:
    build:
      context: packages/ingest
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default_logging
    environment:
      JUICEBOX_API_URL: http://api:8000
      JUICEBOX_API_KEY: ${JUICEBOX_API_KEY:-}
      INGEST_WEBHOOK_SECRET: ${INGEST_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      # Host-local only; reach it through an SSH tunnel (ssh -L 8787:127.0.0.1:8787).
      - "127.0.0.1:8787:8787"
    depends_on:
      - api

  # Sourcing engine: separate FastAPI service with its own `foray` database in
  # the shared Postgres (role/db must exist — see deploy/README.md). No host
  # ports; only the web nginx reaches it, at /foray/. Runs its migrations on
  # start, same pattern as the api.
  foray:
    build:
      context: packages/foray
      dockerfile: Dockerfile
      args:
        FORAY_BAKE_RERANKER: "true"
    restart: unless-stopped
    logging: *default_logging
    cpus: 1.5
    environment: *foray_env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "./scripts/migrate.sh &&
             uvicorn foray.api.app:app --host 0.0.0.0 --port 8100"

  # One-shot job runner for the nightly growth pipeline (compose profile "jobs",
  # so `up` never starts it). Reuses the foray image; its own cgroup with a hard
  # memory fence means an embed OOM cannot take down the search API.
  foray-jobs:
    image: juicebox-foray
    profiles: ["jobs"]
    restart: "no"
    mem_limit: 2500m
    logging: *default_logging
    environment: *foray_env
    volumes:
      # Bulk import inputs (the Bright Data export). Read-only: jobs consume
      # files here, never write them.
      - ./data/in:/data/in:ro
    depends_on:
      db:
        condition: service_healthy
    command: python -m foray.refresh.nightly

    # The foray image bakes a HEALTHCHECK that probes uvicorn on :8100 (correct
    # for `foray`, which shares this image and keeps the default CMD). This is a
    # one-shot batch run that serves no HTTP, so it inherited a probe that can
    # only ever fail: in prod it reached failing_streak=200 without a single
    # pass while the job itself ran fine. A container that is permanently
    # "unhealthy" trains everyone to ignore the health column, so drop the probe
    # rather than invent a fake one.
    healthcheck:
      disable: true

  web:
    build:
      context: packages/web
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default_logging
    depends_on:
      - api
      - foray
    healthcheck:
      # /health is proxied to the api, so this exercises the whole chain.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The candidate portal (apply.goforay.io). A separate image and a separate
  # nginx from `web` on purpose: its config proxies only /v1/portal/, so the
  # recruiter API is not reachable from the candidate domain at all.
  portal:
    build:
      context: packages/portal
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default_logging
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default_logging
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?set PORTAL_DOMAIN in .env, e.g. apply.goforay.io}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - portal

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  filedata:
