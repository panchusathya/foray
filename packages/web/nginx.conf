server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Docker's embedded DNS. With a plain `proxy_pass http://api:8000`, nginx
  # resolves the upstream ONCE at startup and caches the container IP, so
  # rebuilding api or foray (which gives it a new IP) 502s every request until
  # web is also restarted. Resolving through a variable defers lookup to
  # request time, so redeploys of a single service just work.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Single-page app: unknown paths fall through to the router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin proxy so the browser never needs CORS or a second hostname.
  # NOTE: with a variable in proxy_pass, nginx passes the URI as-is and does
  # NOT do prefix replacement, so these must omit the upstream URI (api serves
  # under /v1, /health, /t itself) and /foray/ strips its prefix via rewrite.
  location /v1/ {
    set $api_upstream api;
    proxy_pass http://$api_upstream:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /health {
    set $api_upstream api;
    proxy_pass http://$api_upstream:8000;
  }

  location /t/ {
    set $api_upstream api;
    proxy_pass http://$api_upstream:8000;
  }

  # Foray sourcing engine is a separate service. The rewrite strips the /foray
  # prefix (a trailing-slash proxy_pass can't, because the host is a variable).
  # Buffering off so /search/stream (SSE) reaches the browser incrementally.
  # /internal/* on Foray spends money and is reached over the Docker network
  # by the api container, never by a browser. It has its own shared-secret
  # gate; this makes that the second line of defence rather than the only one.
  location /foray/internal/ {
    return 404;
  }

  location /foray/ {
    set $foray_upstream foray;
    rewrite ^/foray/(.*)$ /$1 break;
    proxy_pass http://$foray_upstream:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
