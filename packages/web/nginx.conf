# http context: conf.d/*.conf is included inside http{}, so this goes at the
# top of the file, outside the server{} block.
limit_req_zone $binary_remote_addr zone=intake_chat:10m rate=20r/m;

# Behind Caddy, $binary_remote_addr is the Caddy container's IP -- without
# this every visitor shares one bucket and the limit throttles everyone or
# nobody.
set_real_ip_from 172.16.0.0/12;   # docker bridge
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Docker's embedded DNS. With a plain `proxy_pass http://api:8000`, nginx
  # resolves the upstream ONCE at startup and caches the container IP, so
  # rebuilding api or foray (which gives it a new IP) 502s every request until
  # web is also restarted. Resolving through a variable defers lookup to
  # request time, so redeploys of a single service just work.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The app and the API share this origin (see the proxy note below), and the
  # session token lives in localStorage, so any reflected markup anywhere under
  # this server block is a session-theft primitive. These are the backstop for
  # that; the handlers still escape their own output.
  #
  # 'unsafe-inline' for style- and script-src is what the Vite bundle needs
  # today (inline module preload + styled attributes). Tightening it to a nonce
  # is worth doing, but the value here is blocking off-origin exfiltration:
  # connect-src/img-src 'self' means injected script has nowhere to send a
  # stolen token.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;

  # Vite writes content-hashed filenames here, so these are safe to cache hard
  # and a deploy invalidates them by changing the name. The =404 matters: these
  # must NOT fall through to the SPA catch-all below, or a browser holding a
  # stale index.html requests a bundle that no longer exists and gets
  # index.html back as 200 text/html, which looks like a working response and
  # fails as a module script.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Single-page app: unknown paths fall through to the router.
  #
  # `expires -1` (Cache-Control: no-cache) is load-bearing on index.html: it
  # names which hashed bundle to load, so a cached copy pins the browser to the
  # previous deploy's JS. With no Cache-Control at all, browsers fall back to
  # heuristic freshness and keep serving it for hours -- that is how the
  # cross-origin CSP bug (see docker-compose.prod.yml's web build args) went on
  # breaking logins after the fix had already shipped. no-cache still
  # revalidates against the ETag, so the common case stays a cheap 304.
  #
  # Use `expires`, not `add_header Cache-Control`: an add_header at this level
  # would reset add_header inheritance and silently drop the CSP and the other
  # security headers set in the server block above.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }

  # Same-origin proxy so the browser never needs CORS or a second hostname.
  # NOTE: with a variable in proxy_pass, nginx passes the URI as-is and does
  # NOT do prefix replacement, so these must omit the upstream URI (api serves
  # under /v1, /health, /t itself) and /foray/ strips its prefix via rewrite.
  location /v1/intake/chat/ {
    limit_req zone=intake_chat burst=10 nodelay;
    limit_req_status 429;
    set $api_upstream api;
    proxy_pass http://$api_upstream:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /v1/ {
    set $api_upstream api;
    proxy_pass http://$api_upstream:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /health {
    set $api_upstream api;
    proxy_pass http://$api_upstream:8000;
  }

  location /t/ {
    set $api_upstream api;
    proxy_pass http://$api_upstream:8000;
  }

  # Foray sourcing engine is a separate service. The rewrite strips the /foray
  # prefix (a trailing-slash proxy_pass can't, because the host is a variable).
  # Buffering off so /search/stream (SSE) reaches the browser incrementally.
  # /internal/* on Foray spends money and is reached over the Docker network
  # by the api container, never by a browser. It has its own shared-secret
  # gate; this makes that the second line of defence rather than the only one.
  location /foray/internal/ {
    return 404;
  }

  location /foray/ {
    set $foray_upstream foray;
    rewrite ^/foray/(.*)$ /$1 break;
    proxy_pass http://$foray_upstream:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
