server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Single-page app: unknown paths fall through to the router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin proxy so the browser never needs CORS or a second hostname.
  location /v1/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /health {
    proxy_pass http://api:8000/health;
  }

  location /t/ {
    proxy_pass http://api:8000;
  }

  # Foray sourcing engine is a separate service; the trailing slash on
  # proxy_pass strips the /foray prefix. Buffering off so /search/stream
  # (server-sent events) reaches the browser incrementally.
  location /foray/ {
    proxy_pass http://foray:8100/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
