name: juicebox

services:
  db:
    # Recreate the pgdata volume if you previously ran vanilla postgres:16.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: juicebox
      POSTGRES_PASSWORD: juicebox
      POSTGRES_DB: juicebox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates a separate `foray` role + database in the same container so the
      # Foray sourcing engine (packages/foray) shares Postgres without touching
      # Juicebox's data. Runs once, on first initialization of the volume.
      - ./packages/foray/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juicebox"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://juicebox:juicebox@db:5432/juicebox
      BASE_URL: http://localhost:8000
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-organizations}
      MS_REDIRECT_URI: ${MS_REDIRECT_URI:-}
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m juicebox.cli migrate &&
             uvicorn juicebox.main:app --host 0.0.0.0 --port 8000"

  # Claims due jobs (outreach ticks/sends, sourcing-agent ticks) from the
  # durable queue. Tick interval is WORKER_TICK_SECONDS (default 60).
  worker:
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://juicebox:juicebox@db:5432/juicebox
      BASE_URL: http://api:8000
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-organizations}
      MS_REDIRECT_URI: ${MS_REDIRECT_URI:-}
    depends_on:
      api:
        condition: service_started
    command: python -m juicebox.cli work

    # The core image bakes a HEALTHCHECK that probes uvicorn on :8000 (correct
    # for `api`, which shares this image). The worker runs the queue loop and
    # serves no HTTP, so it inherited a probe that can only ever fail: it has
    # been reporting "unhealthy" in prod while working fine. Nothing depends on
    # worker being healthy, so drop the probe rather than invent a fake one.
    healthcheck:
      disable: true
  ingest:
    build:
      context: packages/ingest
      dockerfile: Dockerfile
    environment:
      JUICEBOX_API_URL: http://api:8000
      JUICEBOX_API_KEY: ${JUICEBOX_API_KEY:-}
      INGEST_WEBHOOK_SECRET: ${INGEST_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8787:8787"
    depends_on:
      - api

  # Sourcing engine (packages/foray): separate FastAPI service with its own
  # `foray` database in the shared Postgres. The web nginx proxies /foray/ to
  # it, so any compose stack that runs `web` must also run this service.
  foray:
    build:
      context: packages/foray
      dockerfile: Dockerfile
    environment:
      FORAY_DATABASE_URL: postgresql://foray:foray@db:5432/foray
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
    ports:
      - "8100:8100"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "./scripts/migrate.sh &&
             uvicorn foray.api.app:app --host 0.0.0.0 --port 8100"

  web:
    build:
      context: packages/web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
      - foray

volumes:
  pgdata:
