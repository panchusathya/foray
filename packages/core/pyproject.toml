[project]
name = "juicebox-core"
version = "0.1.0"
description = "AI recruiting search + outreach engine (PeopleGPT-style)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    # Reads an .xlsx a recruiter uploads; see routers/imports.py. CSV needs
    # nothing -- that is parsed in the browser.
    "openpyxl>=3.1",
    "numpy>=1.26",
    "httpx>=0.27",
    # 0.78 is the first release whose OutputConfigParam carries `effort` as well
    # as `format`; llm/client.py sends `effort` on every call. Older SDKs accept
    # the install and then fail every model call.
    "anthropic>=0.78",
    "alembic>=1.13",
    "PyYAML>=6.0",
    # Encrypts mailbox OAuth tokens at rest (integrations/crypto.py).
    "cryptography>=42",
    # zoneinfo's tz database: absent on Windows and not guaranteed in slim
    # images — without it every send_timezone silently degrades to UTC.
    "tzdata>=2024.1",
    # Resume PDFs: pypdf extracts text from uploads, reportlab renders the
    # generated resume and cover letter. Both ship pure-Python/manylinux
    # wheels and install into python:3.12-slim with no apt layer — weasyprint
    # would drag in pango/cairo, and headless chromium is a browser.
    "pypdf>=4.0",
    "reportlab>=4.1",
    # Renders the branded job card (presentation/cardimage.py) and reads a
    # palette out of a company logo (enrich/brand.py). It arrives anyway as a
    # reportlab dependency; listed here because we import it directly, and
    # depending on a transitive dep is how a dependency disappears in somebody
    # else's upgrade. A manylinux wheel with no apt layer, unlike the
    # weasyprint and headless-chromium routes rejected above.
    "Pillow>=10.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2.5"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "python-dotenv>=1.0"]
linkedin = ["playwright>=1.40"]
# The Tier-3 browser adapters (applications/submit/browser). Same dependency as
# `linkedin` and kept separate anyway: the API adapters must not acquire a
# Chromium install, and a deployment that only wants Lever/Ashby/Greenhouse
# should not have one.
apply = ["playwright>=1.40"]

[project.scripts]
juicebox = "juicebox.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["juicebox*"]

# The card renderer loads these by path at runtime. Without this they are left
# out of a built wheel and every card falls back to Pillow's bitmap font --
# which does not fail, it just quietly looks wrong in production only.
[tool.setuptools.package-data]
"juicebox.presentation" = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# `live` tests call real provider APIs and are skipped unless the matching key
# is set; everything else must run offline.
addopts = "--strict-markers -m 'not live'"
markers = ["live: hits a real provider API; needs credentials"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = [
    # `Depends(...)` / `Query(...)` in parameter defaults is the FastAPI idiom.
    "B008",
    # Line length is the formatter's job, not the linter's.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests read better with long literal fixtures and local imports.
"tests/*" = ["E402"]
