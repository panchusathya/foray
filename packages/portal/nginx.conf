# The candidate portal's edge. Same shape as packages/web/nginx.conf with one
# deliberate difference that is the whole point of a separate container:
# **only /v1/portal/ is proxied.** Not /v1/, not /foray/, not /t/. From
# apply.goforay.io the recruiter API does not exist, so a route mis-registered
# upstream, or a candidate token that somehow satisfied a recruiter
# dependency, still cannot be reached from here.

# Passwordless login is the whole auth surface, so the endpoints that mint
# sessions get their own bucket. The app enforces the same caps durably (an
# attacker who reaches the api another way is still capped); this stops the
# cheap volume at the edge.
limit_req_zone $binary_remote_addr zone=portal_auth:10m rate=6r/m;

# Behind Caddy, $binary_remote_addr is the Caddy container's IP -- without
# this every visitor shares one bucket and the limit throttles everyone or
# nobody.
set_real_ip_from 172.16.0.0/12;   # docker bridge
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The session token lives in localStorage, so injected script must have
  # nowhere to send it: connect-src 'self' is the load-bearing directive here.
  # frame-src blob: is what lets the inline PDF viewer render a fetched
  # document without handing the file to a third-party viewer.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;

  # Single-page app: /m/<token> and every other route falls through to the
  # router. That GET must stay side-effect-free -- an iMessage link preview
  # prefetches it, and the exchange is a POST the page makes afterwards.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Docker's embedded DNS, resolved per request so redeploying `api` alone
  # does not 502 every portal request until this container restarts too.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /v1/portal/auth/ {
    limit_req zone=portal_auth burst=6 nodelay;
    limit_req_status 429;
    set $api_upstream api;
    proxy_pass http://$api_upstream:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /v1/portal/ {
    set $api_upstream api;
    proxy_pass http://$api_upstream:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # For the container healthcheck only; it exercises the api chain too.
  location = /health {
    set $api_upstream api;
    proxy_pass http://$api_upstream:8000;
  }
}
