# Foray-native relevance queries. Ground truth is a rule over the synthetic
# THEMES corpus (scripts/seed_synthetic.py), not a frozen id list.
#
# theme          the seed theme that must be present on the candidate
# terms_any      at least one of these tokens in the bio/repo description
#
# Rules are source-agnostic: themes come from candidate_signals.domain_markers,
# which derive fills for GitHub and LinkedIn rows alike. Seeded distractors
# (the "-distr"/"_distr" login suffix) are excluded in run_eval.is_relevant and
# additionally measured by junk@10 — no rule here can mark one relevant.

queries:
  - id: founding-ml-vlm
    query: founding ML engineer who has trained LLMs and VLMs
    relevant:
      theme_any: [ml, gpu]
      terms_any: [pytorch, transformers, vllm, triton, cuda]
  - id: backend-go
    query: senior backend engineer in Go
    relevant:
      theme_any: [backend]
  - id: infra-k8s
    query: infrastructure platform engineer with kubernetes and terraform
    relevant:
      theme_any: [infra]
      terms_any: [kubernetes, terraform]
  - id: gpu-cuda
    query: gpu systems engineer writing cuda kernels
    relevant:
      theme_any: [gpu]
      terms_any: [cuda, triton, vllm]
  # The production incident, verbatim shape: "shipped" + "training" +
  # "infrastructure" are lexical bait for the logistics / PM / trainer
  # distractors; only actual ml/gpu people count as relevant.
  - id: founding-ml-infra
    query: founding ML engineer, shipped training infrastructure, 3-8 years
    relevant:
      theme_any: [ml, gpu]
