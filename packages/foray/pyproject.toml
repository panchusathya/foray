[project]
name = "foray"
version = "0.1.0"
description = "Foray sourcing engine: GitHub-sourced candidate search with precomputed archetype fit scores."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tenacity>=8.5",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.3",
    "mypy>=1.15",
    "pre-commit>=4.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.11",
]

[project.scripts]
foray = "foray.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foray"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "model: loads the local sentence-transformers embedding model",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["foray/rank.py"]
strict = true
ignore_missing_imports = true
